# tools/openocd_genesys2.cfg — OpenOCD pour le module de debogage CVA6 sur Genesys2
#
# Reprise de KERONEv2/hypervisor/scripts/openocd_genesys2.cfg, eprouvee sur CE
# design : l'IDCODE 0x00000001 y a ete observe « dans le bitstream
# riscv-iommu-demo ». Voir tools/load_jtag.sh pour l'usage.
#
# Syntaxe OpenOCD >= 0.12 (adapter driver, ftdi vid_pid). L'openocd de Quartus
# (0.11, souvent PREMIER dans le PATH) ne la comprend pas : appeler
# /usr/bin/openocd.
#
# Le cable est le meme que celui de Vivado : aucun hw_server ne doit tourner.

# ----------------------------------------------------------------------
# Adaptateur : FT2232H integre a la Genesys2 (USB JTAG Digilent)
# ----------------------------------------------------------------------

adapter driver ftdi
ftdi device_desc "Digilent Adept USB Device"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# Si « no tap found » : essayer layout_init 0x0018 0x001b (ariane.cfg de CVA6).
ftdi layout_init 0x0088 0x008b

transport select jtag

# 1 MHz. Mesure dans KERONEv2 (2026-06-25) : a 8 MHz, load_image corrompait des
# mots ALEATOIRES en DRAM ; 1 a 4 MHz fiables. Le debit de load_image est borne
# par le progbuf (~20 Kio/s) independamment de la vitesse JTAG : monter ne sert
# a rien. Toujours verifier apres chargement (load_jtag.sh le fait).
adapter speed 1000

# ----------------------------------------------------------------------
# TAP CVA6 : IR 5 bits, IDCODE non configure dans ce bitstream
# (le CVA6 amont renvoie 0x249511C3)
# ----------------------------------------------------------------------

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Acces memoire : progbuf d'abord. Le sysbus de ce CVA6 n'accepte que des acces
# 64 bits alignes : load_image en 32 bits y echoue silencieusement.
riscv set_mem_access progbuf abstract sysbus

# Ne pas halter sur ebreak en M-mode : OpenSBI sonde le semihosting avec un
# ebreak. Sans ce reglage le CPU s'arrete pour le debogueur et sbi_console_init
# bloque avant le premier caractere UART.
riscv set_ebreakm off
